<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prolonge le Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #160c26;
    --gold-a: #fff3b0;
    --gold-b: #ffc83d;
    --gold-c: #ff9500;
  }

  html, body { margin: 0; background: transparent; overflow: hidden; }

  #overlay {
    position: absolute; top: 0; left: 0;
    padding: 14px 30px 24px 34px;
    display: inline-flex; flex-direction: column; align-items: stretch; gap: 16px;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    font-style: italic; font-weight: 900;
    color: #fff;
  }

  /* ---------- Titre ---------- */
  .title { position: relative; align-self: center; padding: 0 50px 0 4px; margin-bottom: 4px; }
  .title-stack { display: grid; position: relative; z-index: 1; }
  .title-stack > span {
    grid-area: 1 / 1;
    font-family: 'Pacifico', 'Segoe Script', 'Brush Script MT', cursive;
    font-style: normal; font-weight: 400;
    font-size: 60px; line-height: 1.32; white-space: nowrap;
    padding: 0 8px 18px;
  }
  .t-stroke {
    color: var(--ink);
    -webkit-text-stroke: 13px var(--ink);
    filter: drop-shadow(0 5px 0 rgba(0,0,0,.35));
  }
  .t-fill {
    position: relative;
    background: linear-gradient(180deg, #ffffff 48%, #d9d1ee 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .swoosh { position: absolute; left: 6px; bottom: -6px; width: calc(100% - 66px); height: 30px; z-index: 0; overflow: visible; }
  .sparks { position: absolute; right: 2px; top: 16px; width: 50px; height: 60px; overflow: visible; }

  /* ---------- Pastilles ---------- */
  .pill {
    position: relative;
    display: flex; align-items: center;
    height: 60px; padding: 0 28px 0 76px;
    border-radius: 999px; border: 4px solid transparent;
    font-size: 32px; letter-spacing: -.3px; white-space: nowrap;
  }
  .pill.coin {
    background:
      linear-gradient(90deg, #2c1708, #170d24 75%) padding-box,
      linear-gradient(90deg, #ffd660, #ff8a00 55%, #ffb21e) border-box;
    box-shadow: 0 0 18px rgba(255,140,0,.55), inset 0 0 14px rgba(255,140,0,.18), 0 5px 0 rgba(0,0,0,.35);
  }
  .pill.follow {
    background:
      linear-gradient(90deg, #24103d, #170d24 75%) padding-box,
      linear-gradient(90deg, #d98cff, #8a2cff 55%, #b44dff) border-box;
    box-shadow: 0 0 18px rgba(170,70,255,.6), inset 0 0 14px rgba(170,70,255,.2), 0 5px 0 rgba(0,0,0,.35);
  }
  .icon {
    position: absolute; left: -12px; top: 50%;
    width: 66px; height: 66px; transform: translateY(-50%);
    border-radius: 50%; display: grid; place-items: center;
  }
  /* Pièce TikTok */
  .icon.coin {
    background:
      radial-gradient(circle at 50% 50%, transparent 0 62%, rgba(140,70,0,.45) 63% 66%, transparent 67%),
      radial-gradient(circle at 34% 28%, #fff7c8 0 10%, #ffd640 34%, #f5a300 68%, #b06400 100%);
    box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 3px rgba(255,255,255,.45), inset 0 -5px 0 rgba(120,60,0,.35), 0 0 18px rgba(255,170,0,.85);
  }
  .icon.coin svg { width: 34px; height: 34px; margin-left: 2px; overflow: visible; filter: drop-shadow(0 2px 0 rgba(110,55,0,.55)); }
  .icon.coin svg path { fill: #fff; stroke: #8f4a00; stroke-width: 1.6; stroke-linejoin: round; paint-order: stroke fill; }
  .icon.follow {
    background: radial-gradient(circle at 34% 28%, #f3d0ff 0 9%, #b44dff 45%, #6d1dff 100%);
    box-shadow: 0 0 0 4px var(--ink), inset 0 0 0 4px rgba(255,255,255,.28), 0 0 18px rgba(180,77,255,.95);
  }
  .icon.follow svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 5; stroke-linecap: round; fill: none; }
  .lbl { text-shadow: 0 3px 0 rgba(0,0,0,.6); }
  .val {
    margin-left: .28em; padding-right: .14em;
    background: linear-gradient(180deg, var(--gold-a) 0%, var(--gold-b) 45%, var(--gold-c) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.55));
  }
</style>
</head>
<body>
<div id="overlay">
  <div class="title">
    <div class="title-stack">
      <span class="t-stroke">Prolonge le Live</span>
      <span class="t-fill">Prolonge le Live</span>
    </div>
    <svg class="swoosh" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="sw" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#ffb000"/>
          <stop offset=".5" stop-color="#ff7a00"/>
          <stop offset=".78" stop-color="#b44dff"/>
          <stop offset="1" stop-color="#7a2cff"/>
        </linearGradient>
      </defs>
      <path d="M3 15 Q 45 3 97 8" stroke="#160c26" stroke-width="13" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
      <path d="M3 15 Q 45 3 97 8" stroke="url(#sw)" stroke-width="7" stroke-linecap="round" fill="none" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="sparks" viewBox="0 0 50 60" aria-hidden="true">
      <g stroke="#160c26" stroke-width="12" stroke-linecap="round">
        <path d="M8 20 L30 8"/><path d="M12 32 L40 31"/><path d="M8 44 L30 54"/>
      </g>
      <g stroke="#ffb000" stroke-width="6" stroke-linecap="round">
        <path d="M8 20 L30 8"/><path d="M12 32 L40 31"/><path d="M8 44 L30 54"/>
      </g>
    </svg>
  </div>

  <!-- 1 pièce = +1 sec -->
  <div class="pill coin">
    <div class="icon coin">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
    </div>
    <span class="lbl">1 pièce =</span><span class="val">+1 sec</span>
  </div>

  <!-- 1 follow = +10 sec -->
  <div class="pill follow">
    <div class="icon follow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    </div>
    <span class="lbl">1 follow =</span><span class="val">+10 sec</span>
  </div>
</div>
</body>
</html>
